<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <title>Contacto</title>
</head>
<body>
    <header class="header">
        <p class="header_logo">
            <a href="../index.html" class="logo">
                <img src="../images/logosololetras.jpg" alt="Sanctuary Shop" width="200">
            </a>
        </p>
        <nav class="header_nav">

        <ul>
            <li><a href="../index.html">Inicio</a></li>
            <li><a href="./contacto.html">Contacto</a></li>
            <li><a href="./carrito.html">🛒</a></li>
        </ul>
    </header>
    
    <main class="contacto">
        <form class="formulario" action="https://formspree.io/f/xeaqrlbd" method="POST">
            <label>Nombre:
                <input type="text" name="nombre" required>
            </label><br>
            
            <label>Email:
                <input type="email" name="email" required>
            </label><br>
            
            <label>Mensaje:
                <textarea name="mensaje" required></textarea>
            </label><br>
            
            <button type="submit">Enviar</button>
        </form>
    </main>
    
    <footer class="footer">Esta pagina la diseño César Morán</footer>
</body>
</html>
